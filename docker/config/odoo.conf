[options]
; ==============================================================
; Jinasena Clear_DB — Odoo 17 Enterprise Configuration
; ==============================================================

; --- Database ---
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = False
db_maxconn = 64

; --- Addons paths (order matters — later paths override earlier) ---
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/enterprise-addons,/mnt/third-party-addons,/mnt/extra-addons

; --- Data ---
data_dir = /var/lib/odoo

; --- HTTP ---
http_interface = 0.0.0.0
http_port = 8069
longpolling_port = 8072
proxy_mode = False

; --- Logging ---
log_level = info
log_handler = :INFO

; --- Performance (adjust for your server RAM) ---
workers = 2
max_cron_threads = 1

; Limits (bytes / seconds)
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 600

; --- Email (update with your SMTP server) ---
; email_from = noreply@yourdomain.com
; smtp_server = smtp.gmail.com
; smtp_port = 587
; smtp_encryption = starttls
; smtp_user = your@gmail.com
; smtp_password = yourpassword

; --- Security ---
; list_db = False        ; uncomment to hide DB list on login page
; admin_passwd = change_this_master_password_immediately
